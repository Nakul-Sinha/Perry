name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: perry_test
          POSTGRES_USER: perry_ci
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          PERRY_TEST_DATABASE_URL: postgresql://perry_ci:disposable-ci-fixture@127.0.0.1:${{ job.services.postgres.ports[5432] }}/perry_test
      - run: pnpm build

  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      IMAGE: docker.io/library/node@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Prepare rootless runtime
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman pull "$IMAGE"
      - name: Exercise isolated checks
        run: node tools/compatibility/sandbox-live.ts "$IMAGE"
